{% extends "base.html" %}
{% block title %}Delete Task{% endblock %}
{% block content %}
  <h2>Delete Task</h2>
  <p>Are you sure you want to delete <strong>{{ task.title }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
  </form>
  <p><a href="{% url 'tasks:detail' task.id %}">&larr; Cancel</a></p>
{% endblock %}
